# Supabase configuration for NextGen Future Network
project_id = "zengxnuzpowqeiifdhin"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.create-payment-order]
verify_jwt = true

[functions.verify-payment]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.validate-ticket]
verify_jwt = true
